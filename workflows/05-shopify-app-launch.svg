<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><ns0:title id="title">Pumper merchant growth journey</ns0:title><ns0:desc id="desc">A rising merchant adoption curve, from app discovery and trust to adoption and more than four thousand merchants.</ns0:desc><ns0:defs><ns0:linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><ns0:stop offset="0" stop-color="#2f7d5b" stop-opacity=".22" /><ns0:stop offset="1" stop-color="#2f7d5b" stop-opacity="0" /></ns0:linearGradient></ns0:defs><ns0:style>text{font-family:Inter,Arial,sans-serif;fill:#202124}.muted{fill:#777980}.label{font-size:15px;font-weight:700;letter-spacing:1.2px}.line{fill:none;stroke:#2f7d5b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.small{font-size:16px}.big{font-size:34px;font-weight:750}@media(prefers-reduced-motion:reduce){animateMotion{display:none}}</ns0:style><ns0:text x="70" y="58" class="label muted">MERCHANT ADOPTION JOURNEY</ns0:text><ns0:text x="70" y="96" font-size="28" font-weight="700">From app discovery to a growing merchant base</ns0:text><ns0:path d="M90 385 C250 380 280 350 400 330 S600 275 710 235 S930 150 1090 105 L1090 410 L90 410 Z" fill="url(#area)" /><ns0:path id="growth" d="M90 385 C250 380 280 350 400 330 S600 275 710 235 S930 150 1090 105" class="line" /><ns0:circle cx="90" cy="385" r="8" fill="#fff" stroke="#2f7d5b" stroke-width="4" /><ns0:circle cx="400" cy="330" r="8" fill="#fff" stroke="#2f7d5b" stroke-width="4" /><ns0:circle cx="710" cy="235" r="8" fill="#fff" stroke="#2f7d5b" stroke-width="4" /><ns0:circle cx="1090" cy="105" r="10" fill="#2f7d5b" /><ns0:g transform="translate(70 430)"><ns0:text class="small" font-weight="700">App discovery</ns0:text><ns0:text y="25" class="small muted">Merchant finds the app</ns0:text></ns0:g><ns0:g transform="translate(345 375)"><ns0:text class="small" font-weight="700">Trust &amp; certification</ns0:text><ns0:text y="25" class="small muted">Built for Shopify</ns0:text></ns0:g><ns0:g transform="translate(650 280)"><ns0:text class="small" font-weight="700">Adoption</ns0:text><ns0:text y="25" class="small muted">Improved merchant sign-ups</ns0:text></ns0:g><ns0:g transform="translate(925 55)"><ns0:text class="big">4,000+</ns0:text><ns0:text y="27" class="small muted">Merchants</ns0:text></ns0:g><ns0:text x="70" y="505" class="small muted">Reported outcomes: 4,000+ merchants · 20% increase in merchant sign-ups</ns0:text><ns0:circle r="5.5" fill="#28734f" stroke="#ffffff" stroke-width="2"><ns0:animateMotion dur="9.93s" repeatCount="indefinite" rotate="auto" path="M90 385 C250 380 280 350 400 330 S600 275 710 235 S930 150 1090 105" /></ns0:circle><ns0:circle r="5.5" fill="#28734f" stroke="#ffffff" stroke-width="2"><ns0:animateMotion dur="9.93s" repeatCount="indefinite" rotate="auto" path="M90 385 C250 380 280 350 400 330 S600 275 710 235 S930 150 1090 105"  begin="-0.8s"/></ns0:circle><ns0:circle r="5.5" fill="#28734f" stroke="#ffffff" stroke-width="2"><ns0:animateMotion dur="9.93s" repeatCount="indefinite" rotate="auto" path="M90 385 C250 380 280 350 400 330 S600 275 710 235 S930 150 1090 105"  begin="-1.6s"/></ns0:circle></ns0:svg>