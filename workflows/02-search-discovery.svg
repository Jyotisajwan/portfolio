<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1400 310" role="img" aria-labelledby="title desc" width="1120" height="300">
<ns0:title id="title">Search and Discovery workflow</ns0:title>
<ns0:desc id="desc">At upload, slides are analysed by vision models. Gemini Flash extracts imagery, text, visual flow and business concept metadata, which is stored in a vector database. At search, a query enters Apache Solr for hybrid keyword and semantic retrieval, followed by relevance ranking and results. A 1,000-query evaluation recorded 99 percent solved and the no-results rate fell from 10 percent to under 1 percent.</ns0:desc>
<ns0:defs>
  <ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></ns0:marker>
  <ns0:style>
    text{font-family:Inter,Arial,sans-serif}.muted{fill:#85858b}.dark{fill:#222}.green{fill:#28734f}.small{font-size:12px}.tiny{font-size:10px}.label{font-size:11px;font-weight:700;letter-spacing:1px;fill:#85858b}.line{fill:none;stroke:#262626;stroke-width:1.5;marker-end:url(#arrow)}.dash{fill:#fbfbfc;stroke:#d8d8de;stroke-width:1.3;stroke-dasharray:5 5}.node{fill:#fff;stroke:#d6d6dc;stroke-width:1.3}.tag{fill:#fff;stroke:#a8c9b8;stroke-width:1.2}
    @media(prefers-reduced-motion:reduce){animate,animateMotion{display:none}}
  </ns0:style>
</ns0:defs>

