<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="-65 0 1250 300" role="img" aria-labelledby="title desc" width="1120" height="300">
<ns0:title id="title">Lightning Studio workflow</ns0:title>
<ns0:desc id="desc">A horizontal four-step workflow from a new brand template through asset structuring and automated conversion to brand-compliant shells, reducing conversion time from three to four days to seconds.</ns0:desc>
<ns0:defs><ns0:marker id="lightning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><ns0:path d="M1 1 L9 5 L1 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></ns0:marker></ns0:defs>
<ns0:style>
text{font-family:Inter,Arial,sans-serif}.muted{fill:#6e6e73}.node{fill:#fff;stroke:#d2d2d7;stroke-width:1.2}.active{fill:#fff;stroke:#1e6647;stroke-width:1.5}.connector{fill:none;stroke:#1a1a1a;stroke-width:1.6;marker-end:url(#lightning-arrow)}
</ns0:style>
<ns0:text x="28" y="30" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6e6e73">WORKFLOW</ns0:text>
<ns0:text x="28" y="60" font-size="23" font-weight="700" fill="#1a1a1a">Lightning Studio</ns0:text>
<ns0:text x="28" y="82" font-size="13" class="muted">Automated brand-template conversion</ns0:text>
<ns0:path class="connector" d="M120 171 H292" /><ns0:path class="connector" d="M470 171 H642" /><ns0:path class="connector" d="M820 171 H992" />
<ns0:g><ns0:rect class="node" x="-50" y="130" width="170" height="82" rx="12" /><ns0:text x="35" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">1. New brand template</ns0:text><ns0:text x="35" y="190" text-anchor="middle" font-size="10.5" class="muted">Client uploads template</ns0:text></ns0:g>
<ns0:g><ns0:rect class="node" x="300" y="130" width="170" height="82" rx="12" /><ns0:text x="385" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">2. Structure</ns0:text><ns0:text x="385" y="190" text-anchor="middle" font-size="10.5" class="muted">Convert slide assets to SVG</ns0:text></ns0:g>
<ns0:g><ns0:rect class="node" x="650" y="130" width="170" height="82" rx="12" /><ns0:text x="735" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">3. Conversion engine</ns0:text><ns0:text x="735" y="190" text-anchor="middle" font-size="10.5" class="muted">Apply brand rules &amp; layouts</ns0:text></ns0:g>
<ns0:g><ns0:rect class="active" x="1000" y="130" width="170" height="82" rx="12" /><ns0:text x="1085" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">4. Brand-compliant shells</ns0:text><ns0:text x="1085" y="190" text-anchor="middle" font-size="10.5" class="muted">Ready in seconds</ns0:text></ns0:g>
<ns0:rect x="28" y="250" width="1064" height="1" fill="#e5e5e7" /><ns0:text x="30" y="282" font-size="23" font-weight="750" fill="#1a1a1a">3–4 days → seconds</ns0:text><ns0:text x="300" y="280" font-size="12" class="muted">Template conversion</ns0:text>
<ns0:circle r="5.5" fill="#28734f" stroke="#ffffff" stroke-width="2"><ns0:animateMotion dur="4.91s" repeatCount="indefinite" rotate="auto" path="M120 171 H292 M470 171 H642 M820 171 H992" /></ns0:circle><ns0:circle r="5.5" fill="#28734f" stroke="#ffffff" stroke-width="2"><ns0:animateMotion dur="4.91s" repeatCount="indefinite" rotate="auto" path="M120 171 H292 M470 171 H642 M820 171 H992"  begin="-0.8s"/></ns0:circle><ns0:circle r="5.5" fill="#28734f" stroke="#ffffff" stroke-width="2"><ns0:animateMotion dur="4.91s" repeatCount="indefinite" rotate="auto" path="M120 171 H292 M470 171 H642 M820 171 H992"  begin="-1.6s"/></ns0:circle></ns0:svg>